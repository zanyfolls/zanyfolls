<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daftar Layanan</title>
<style>
    body { font-family: Arial; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 8px; border: 1px solid #ccc; }
    th { background: #f2f2f2; }
</style>
</head>
<body>

<h2>Daftar Layanan</h2>
<p id="status">Memuat data dari server...</p>

<table id="servicesTable" style="display:none">
    <thead>
        <tr>
            <th>ID</th>
            <th>Layanan</th>
            <th>Kategori</th>
            <th>Harga</th>
            <th>Min</th>
            <th>Max</th>
            <th>Deskripsi</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
const API_PROXY = "https://script.google.com/macros/s/AKfycbwQsBDGd2U4qmwAPZLfnehYi04euNP5icmCTWxaxnZ8YMMZFCFzksCYqQBT8Ah-xyZvug/exec"; // GANTI

fetch(API_PROXY, { method: "GET" })
    .then(res => res.json())
    .then(data => {
        const status = document.getElementById("status");
        const table = document.getElementById("servicesTable");
        const tbody = table.querySelector("tbody");

        if (!data.data) {
            status.innerText = "Gagal memuat layanan (API kosong).";
            return;
        }

        status.style.display = "none";
        table.style.display = "table";

        data.data.forEach(srv => {
            tbody.innerHTML += `
                <tr>
                    <td>${srv.id}</td>
                    <td>${srv.name}</td>
                    <td>${srv.category}</td>
                    <td>${srv.price}</td>
                    <td>${srv.min}</td>
                    <td>${srv.max}</td>
                    <td>${srv.description}</td>
                </tr>
            `;
        });
    })
    .catch(err => {
        document.getElementById("status").innerText = "Error fetch API.";
        console.error(err);
    });
</script>

</body>
</html>
